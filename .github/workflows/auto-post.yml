name: Threads 自動投稿

on:
  schedule:
    # UTCで指定。日本時間(JST)= UTC+9。1日3投稿（朝の通勤前＋夜のゴールデンタイム）。
    # リサーチ結論: 朝7-9時(他SNSの約2.3倍) / 夜18-21時が最も反応が良い。昼12-13時は競合が激しく回避。
    - cron: "0 22 * * *" # 07:00 JST（朝の通勤・始業前）
    - cron: "0 9 * * *"  # 18:00 JST（夜のゴールデンタイム開始）
    - cron: "0 12 * * *" # 21:00 JST（夜のピーク）
  workflow_dispatch: # 手動実行ボタン（テスト用）
    inputs:
      slot:
        description: "テストする投稿枠（morning=ニュース+写真 / evening=ノウハウツリー / night=テキストのみ）"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - night

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci || npm install

      # バズ調査キャッシュ（1日1回だけ調査し、同日の別枠で使い回す）。
      # CIは毎回まっさらな環境なので、JSTの日付をキーに actions/cache で持ち越す。
      - name: JSTの日付を取得（キャッシュキー用）
        id: jst
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"

      - name: バズ調査キャッシュを復元/保存
        uses: actions/cache@v4
        with:
          path: outbox/buzz-cache.json
          key: buzz-cache-${{ steps.jst.outputs.date }}

      - name: 本文＋（朝のみ）Pexels写真URLを生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 文章生成(Claude)・必須
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}         # 任意(既定 claude-opus-4-8)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}        # 画像取得・任意(無ければ画像なし)
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }} # バズ調査(Threads内検索)用
          FORCE_SLOT: ${{ github.event.inputs.slot }}          # 手動実行時のみ枠を固定（cronでは空＝時刻で自動選択）
        run: npm run generate

      # 画像は Pexels の公開URLをそのまま使う → リポジトリへの画像コミットは不要
      - name: Threads に公開
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: npm run post

  # ※ トークンは「手動更新」運用（60日失効前に自分で更新）。
  #    手順は やることリスト.md を参照。自動更新にしたくなったら refresh ジョブを足せます。
