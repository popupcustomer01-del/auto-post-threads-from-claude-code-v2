# ============================================================
#  persona.yml — 投稿の「発信方針」設定ファイル
#  ここを本文生成スクリプト(src/generate.mjs)が読み込み、毎日の投稿を作ります。
#  「#」で始まる行はコメント（説明）です。各項目の値を書き換えてください。
#  ※ 収益導線などの非公開メモは _private/strategy.md に置いています（Git非公開）。
# ============================================================

# --- 1. 発信ジャンル -----------------------------------------
genre: "AI活用 × 副業（初心者向け）"

# --- 2. ターゲット（誰に刺すか）------------------------------
target:
  age: "20〜30代"
  gender: "不問（やや女性寄り）"
  job: "会社員・主婦・副業初心者"
  pain: "AIを学んで副業したいが、何から始めればいいか分からない／時間がない"
  desire: "スキマ時間でAIを使って“最初の1円”を稼ぎたい・将来の安心"

# --- 3. キャラ・立場 ----------------------------------------
persona:
  first_person: "わたし"          # 一人称。「わたし」推奨
  role: "アリス｜元・会社員（カスタマーサービス）。AIに出会い副業で月+5万を達成中。先生ではなく“少し先を行く同志”"
  strength: "AI時短の実体験・0→1の始め方・失敗からの立て直しを同じ目線で共有（プロンプト配布はしない）"
  episode: "AIを触る前は毎日残業つづきの事務職。最初はAIをうまく使えず空回りして挫折しかけた → 小さく続けて約半年で副業月+5万に（※この「約半年」は固定の事実 投稿ごとに期間を変えない）"
  signature_phrase: "100回言ってるけど"  # シグネチャー口癖。フックの型の1つとして"あえて"繰り返し キャラの記憶フックにする（2026-08-20 集客特化アカ分析 _private/threads-research-toam-marke.md）

# --- 4. 投稿ペースと時間帯 ----------------------------------
# ※実際の投稿時刻は .github/workflows/auto-post.yml の cron が支配します（下記と一致）。
# ※2026-08調査(フラーApp Ape実測): 日本のThreads利用ピークは平日7時/19-22時 最大21時台。
#   ピーク直前に投稿して初速を稼ぐ。cron(auto-post.yml)と一致させること。
schedule:
  posts_per_day: 3
  times:
    - "07:07"
    - "19:17"
    - "20:37"

# --- 5. ネタの情報源（お任せ生成の材料）---------------------
# ※2026-08リサーチ結論: ニュース紹介型は最弱・体験談変換が最強。
#   すべて「わたしが実際に〜した」の一人称体験談として書ける形にしている。
topics_pool:
  # ★調査結論に沿って「体験談・数字実績・失敗告白・持論・あるある」を主軸にする。
  #   このアカウントはプロンプト配布はしない。読者に配る"実物"ではなく
  #   わたしの体験・数字・気づきで価値を出す（ノウハウの箇条書き列挙も最弱なので避ける）。
  # --- 数字・実績のV字（バズ率1位・アリスの核）---
  - "残業つづきの事務職→AI副業で月+5万までのV字を時系列で語る"
  - "AIで毎日の作業が◯分→◯分になった実感（作業名を具体的に）"
  - "副業を始めて最初の1か月が0円だった話と そこから変わったこと"
  - "毎朝5分だけ続けた習慣が30日で形になった実感"
  # --- 失敗告白ストーリー（一撃特大の型）---
  - "AI副業でいちばん恥ずかしかった失敗と そこからの学び"
  - "「いい感じにして」しか言えず空回りしていた頃の話"
  - "生成物をそのまま出して 自分の言葉がゼロだった失敗"
  - "話題のアプリを増やしすぎて どれも中途半端になった失敗"
  # --- 断言・持論（失敗ベース・逆張り）---
  - "AI副業で消耗する人の勘違いを1つ言い切る"
  - "道具を増やすより1つを深く使うべきという持論"
  - "才能より続ける仕組みが9割という持論"
  - "初心者が最初から稼ごうとして失敗する理由"
  # --- あるある共感（世代・在宅・初心者）---
  - "副業を始めた人あるあるを具体行動で3つ"
  - "在宅ワーク・スキマ時間のあるある"
  - "AIを使い始めた初心者がつまずくあるある"
  - "副業を周りに言えず1人で抱える気持ちへの共感"
  # --- 日常の小さなAI活用（配布でなく"わたしの体験"として）---
  - "わたしが地味に助かっているAIの使い方を1場面だけ"
  - "通勤のスキマ時間にAIと過ごすようになって変わったこと"
  - "献立や連絡など毎日の小さな面倒をAIに渡した実感"
  # --- 過程公開・つながり ---
  - "AI副業の過程をありのまま公開する（今日の小さな一歩）"
  - "同じように始めた人とつながりたいという素直な気持ち"

# --- 6. 投稿枠（スロット）設計 -------------------------------
# 1日3投稿を「役割」で分ける（同じ型の連投を避け、時間帯ごとに読者の気分に合わせる）。
# generate.mjs が実行時刻(UTC)に最も近い枠を自動で選び、役割・型・締め方を切り替えます。
#   utc_hour: JST時刻から-9した値（例 07:00 JST → 22 UTC）。schedule/cron と一致させること。
#   closing:  save=保存を促す / soft=静かな余韻 / question=問いかけで締める
#   lengths:  単発投稿の長さ候補（毎回この中から乱択）short=40〜120字 / medium=150〜250字 / long=400〜500字
#             ※ツリー枠(news:true / thread:true)は保存狙いなので常に長め。lengths は単発投稿にだけ効く
slots:
  - key: "morning"          # 朝：今日すぐ使えるHow-to・チェックリスト（保存狙い）
    jst: "07:07"
    utc_hour: 22
    role: "価値提供・How-to"
    goal: "保存・新規リーチ・プロフ流入"
    # ★型は毎回この中から乱択（固定しない＝毎日同じ型を避ける）
    styles: ["①数字・実績型", "⑥ノウハウ・保存版型", "⑦長文ストーリー型"]
    # ★締めも毎回この中から乱択（save=保存 / action=具体アクション / assert=言い切り持論）
    #   朝枠は質問で締めない（問いかけは夜枠に集中させる）
    closings: ["save", "action", "assert", "save"]
    # ★単発になる日（ニュースが無い日）の長さ。朝は短〜中で軽く。ツリーの日はこの設定は無視
    lengths: ["short", "medium", "medium"]
    style: "①数字・実績型"    # フォールバック（styles が無いとき用）
    closing: "save"           # フォールバック
    image: false              # 画像は使わない（全枠テキストのみ運用）
    news: true                # ★朝はニュース解説（2026-08-12 ユーザー判断で復活）。単なる速報ではなく
                              #   「何が起きた→かみ砕き解説→今日やること」の詳しい初心者向け解説ツリーにする
    guide: "新着AIニュースを初心者向けに詳しく解説 ニュースが無い日は今日すぐ試せる時短術や手順を1つ 体験のビフォーアフター数字で語る"
  - key: "evening"          # 夕：ノウハウツリー（保存・フォロー狙い）
    jst: "19:17"
    utc_hour: 10
    role: "ノウハウ・保存"
    goal: "保存・フォロー・プロフ流入"
    styles: ["⑦長文ストーリー型", "①数字・実績型", "④断言・持論型", "⑥ノウハウ・保存版型"]
    closings: ["soft", "assert", "action", "soft"]  # 夕枠も質問で締めない
    style: "⑦長文ストーリー型"  # フォールバック
    closing: "soft"             # フォールバック
    image: false              # テキストのみ
    thread: true              # ★2〜3本ツリー。1本目に価値の8割＋番号付きノウハウ、最終本でフォロー誘導
    buzz: true                # ★生成前にWeb検索で「今バズってる投稿」を調査し 構成・フックを参考にする
    guide: "1つのテーマを深掘り 1本目に具体ノウハウの大半を入れる わたしの失敗談を1つ混ぜる"
  - key: "night"            # 夜：問いかけ・エンゲージ（返信集中→拡散狙い）
    jst: "20:37"
    utc_hour: 11
    role: "問いかけ・エンゲージ"
    goal: "返信数を集めてアルゴリズムブースト・フォロワー外拡散"
    # 夜枠は問いかけ主体だが 毎回同じ質問形にならないよう あるある/持論も混ぜる
    styles: ["③質問・問いかけ型", "⑤あるある共感型", "④断言・持論型"]
    closings: ["question", "assert", "question", "action"]
    # ★夜は短文中心（3回に2回はショート）。問いかけ/あるあるはワンフレーズで刺すのが正解
    lengths: ["short", "short", "medium"]
    style: "③質問・問いかけ型"  # フォールバック
    closing: "question"         # フォールバック
    image: false              # テキストのみ
    buzz: true                # ★生成前にWeb検索で「今バズってる投稿」を調査し 構成・フックを参考にする
    guide: "答えやすい二択や あるある共感 短めで会話を誘う 難しい質問にしない 実体験や具体場面を1つ添えてから問う"

# フォールバック用（slots が無い・時刻が一致しない場合に使う型の候補）
use_styles:
  - "①数字・実績型"
  - "②権威・キュレーション型"
  - "③質問・問いかけ型"
  - "④断言・持論型"
  - "⑤あるある共感型"
  - "⑥ノウハウ・保存版型"
  - "⑦長文ストーリー型"

# --- 6.5 ニュース設定（news: true の枠で使用）----------------
# ★朝枠で使用中。バズ調査では「見出し＋一言の速報型」は最弱だったため、
#   生成側(generate.mjs)で「詳しく解説→今日やること」の解説ツリーに変換して投稿する。
# 直近 fresh_hours 時間の新着RSSから「副業初心者が使える話題」だけを選ぶ。
#   1) exclude に1つでも該当したら不採用（難しい/無関係を除外）
#   2) 残りを keywords でスコアリングし min_score 以上の最上位を1件採用
#   3) 該当が無い日は自動で通常のHow-to単発にフォールバック
news:
  fresh_hours: 24
  min_score: 3               # 副業キーワードのヒット下限（上げるほど厳選）
  feeds:
    - "https://openai.com/news/rss.xml"
    - "https://deepmind.google/blog/feed/basic/"
    - "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml"
  keywords:                  # ★副業で使える話題（加点）。企業名や"AI"だけの汎用語は入れない
    - "ChatGPT"
    - "Gemini"
    - "Copilot"
    - "画像生成"
    - "動画生成"
    - "音声"
    - "文字起こし"
    - "文章"
    - "ライティング"
    - "翻訳"
    - "プロンプト"
    - "テンプレート"
    - "Canva"
    - "Notion"
    - "無料"
    - "無料化"
    - "使い方"
    - "使ってみた"
    - "新機能"
    - "アプリ"
    - "スマホ"
    - "副業"
    - "時短"
    - "自動化"
    - "初心者"
  exclude:                   # ★難しすぎ/副業に無関係（1つでも該当したら不採用）
    - "セキュリティ"
    - "サイバー"
    - "防御"
    - "脆弱性"
    - "攻撃"
    - "規制"
    - "訴訟"
    - "軍事"
    - "政府"
    - "決算"
    - "資金調達"
    - "買収"
    - "上場"
    - "株価"
    - "特許"
    - "半導体"
    - "GPU"
    - "データセンター"
    - "量子"
    - "研究"
    - "論文"
    - "エンタープライズ"
    - "企業向け"
    - "API仕様"

# --- 7. NGライン（ガードレール）------------------------------
ng:
  topics:
    - "政治・宗教・センシティブな時事"
    - "医療・投資などの断定的アドバイス"
  words:
    - "誰でも簡単に"
    - "完全放置で稼げる"
    - "絶対に稼げる／絶対に損しない"
    - "月100万確定"

# --- 8. 画像（Pexelsライブ検索）設定 -----------------------
# ★現在オフ：全スロットが image: false なので、この設定は使われません（全枠テキストのみ）。
#   画像を再開したい場合は、上の使いたい枠の image を true に戻してください。
# 以下は「朝の枠(image: true)だけ、毎回 Pexels を検索して写真を1枚添付」する設定（src/pexels.mjs）。
#   - search: true = 毎回ライブ検索。人物・他社ロゴ・ブランド物は alt で自動除外（BLOCK_WORDS）
#   - 検索が使えない/全部除外された日は、下の photos に自動退避（保険）
#   - 乱数を使わず日付で決定的に選ぶ（毎日ちがう写真）
#   - orientation は指定しない（正方形固定はブランド撮影シリーズに偏るため）。最後にURLで1080角クロップ
image:
  pexels:
    search: true                   # ← 毎回検索する。false/未指定なら photos の厳選ローテになる
    per_page: 20                   # 検索の取得件数（多いほど除外後の選択肢が増える）
    queries:                       # 検索ワード（英語推奨・簡潔に）。人物/ブランドが出にくい物・飲み物中心
      - "coffee"
      - "latte"
      - "tea"
      - "office"
      - "workspace"
      - "notebook"
    photos:                        # 退避用（検索が使えない日だけ使う。目視確認済みのクリーン写真）
      - "https://images.pexels.com/photos/27860686/pexels-photo-27860686.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
      - "https://images.pexels.com/photos/31711944/pexels-photo-31711944.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
      - "https://images.pexels.com/photos/26985929/pexels-photo-26985929.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
      - "https://images.pexels.com/photos/4913342/pexels-photo-4913342.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
# ============================================================
