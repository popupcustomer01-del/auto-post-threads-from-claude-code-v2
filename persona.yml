# ============================================================
#  persona.yml — 投稿の「発信方針」設定ファイル
#  ここを本文生成スクリプト(src/generate.mjs)が読み込み、毎日の投稿を作ります。
#  「#」で始まる行はコメント（説明）です。各項目の値を書き換えてください。
#  ※ 収益導線などの非公開メモは _private/strategy.md に置いています（Git非公開）。
# ============================================================

# --- 1. 発信ジャンル -----------------------------------------
genre: "AI活用 × 副業（初心者向け）"

# --- 2. ターゲット（誰に刺すか）------------------------------
target:
  age: "20〜30代"
  gender: "不問（やや女性寄り）"
  job: "会社員・主婦・副業初心者"
  pain: "AIを学んで副業したいが、何から始めればいいか分からない／時間がない"
  desire: "スキマ時間でAIを使って“最初の1円”を稼ぎたい・将来の安心"

# --- 3. キャラ・立場 ----------------------------------------
persona:
  first_person: "わたし"          # 一人称。「わたし」推奨
  role: "アリス｜元・会社員（カスタマーサービス）。AIに出会い副業で月+5万を達成中。先生ではなく“少し先を行く同志”"
  strength: "コピペで使えるプロンプト・AI時短ハック・0→1の始め方をやさしく解説"
  episode: "AIを触る前は残業まみれの事務職。最初はプロンプト作りに1時間かかって挫折しかけた → 型を覚えて副業月+5万に"

# --- 4. 投稿ペースと時間帯 ----------------------------------
# ※実際の投稿時刻は .github/workflows/auto-post.yml の cron が支配します（下記と一致）。
schedule:
  posts_per_day: 3
  times:
    - "07:00"
    - "18:00"
    - "21:00"

# --- 5. ネタの情報源（お任せ生成の材料）---------------------
topics_pool:
  - "コピペで使えるChatGPT/Claudeプロンプト紹介"
  - "AIで作業が激変した時短ハック（ビフォーアフター）"
  - "AI副業の始め方・0→1の手順"
  - "初心者がやりがちなAIの失敗と回避法"
  - "知らないと損する生成AIツール◯選"
  - "AIで作った成果物・小さな収益の実況"
  - "新しいAIツール／新モデルの“使ってみた”速報"
  - "会社員・主婦がスキマ時間でAIを学ぶコツ"

# --- 6. 投稿枠（スロット）設計 -------------------------------
# 1日3投稿を「役割」で分ける（同じ型の連投を避け、時間帯ごとに読者の気分に合わせる）。
# generate.mjs が実行時刻(UTC)に最も近い枠を自動で選び、役割・型・締め方を切り替えます。
#   utc_hour: JST時刻から-9した値（例 07:00 JST → 22 UTC）。schedule/cron と一致させること。
#   closing:  save=保存を促す / soft=静かな余韻 / question=問いかけで締める
slots:
  - key: "morning"          # 朝：ニュース(副業向けのみ)優先／無ければHow-to
    jst: "07:00"
    utc_hour: 22
    role: "価値提供・How-to"
    goal: "保存・新規リーチ・プロフ流入"
    style: "①数字・実績型"
    closing: "save"
    image: true               # この枠だけシンプルな引用カードを添付（他はテキストのみ）
    news: true                # ★副業初心者が使える新着AIニュースだけ3本ツリー化。無ければHow-to
    guide: "AIの時短術や具体的な手順を1つ 今日すぐ使える 箇条書き中心 数字を入れる"
  - key: "evening"          # 夕：ノウハウ長文ツリー（保存・フォロー狙い）
    jst: "18:00"
    utc_hour: 9
    role: "ノウハウ・保存"
    goal: "保存・フォロー・プロフ流入"
    style: "⑦長文ストーリー型"
    closing: "soft"
    image: false              # テキストのみ
    thread: true              # ★共感フック→①〜⑤の具体ノウハウ→フォロー誘導 の長文ツリー(2〜4本)
    guide: "1つのテーマを深掘り 番号付きの具体ノウハウを並べる 最後はやわらかいフォロー誘導"
  - key: "night"            # 夜：問いかけ・エンゲージ（返信集中→拡散狙い）
    jst: "21:00"
    utc_hour: 12
    role: "問いかけ・エンゲージ"
    goal: "返信数を集めてアルゴリズムブースト・フォロワー外拡散"
    style: "③質問・問いかけ型"
    closing: "question"
    image: false              # テキストのみ
    guide: "答えやすい二択や あるある共感 短めで会話を誘う 難しい質問にしない"

# フォールバック用（slots が無い・時刻が一致しない場合に使う型の候補）
use_styles:
  - "①数字・実績型"
  - "③質問・問いかけ型"
  - "⑤あるある共感型"
  - "⑦長文ストーリー型"

# --- 6.5 ニュース設定（news: true の枠で使用）----------------
# 直近 fresh_hours 時間の新着RSSから「副業初心者が使える話題」だけを選ぶ。
#   1) exclude に1つでも該当したら不採用（難しい/無関係を除外）
#   2) 残りを keywords でスコアリングし min_score 以上の最上位を1件採用
#   3) 該当が無い日は自動で通常のHow-to単発にフォールバック
news:
  fresh_hours: 24
  min_score: 3               # 副業キーワードのヒット下限（上げるほど厳選）
  feeds:
    - "https://openai.com/news/rss.xml"
    - "https://deepmind.google/blog/feed/basic/"
    - "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml"
  keywords:                  # ★副業で使える話題（加点）。企業名や"AI"だけの汎用語は入れない
    - "ChatGPT"
    - "Gemini"
    - "Copilot"
    - "画像生成"
    - "動画生成"
    - "音声"
    - "文字起こし"
    - "文章"
    - "ライティング"
    - "翻訳"
    - "プロンプト"
    - "テンプレート"
    - "Canva"
    - "Notion"
    - "無料"
    - "無料化"
    - "使い方"
    - "使ってみた"
    - "新機能"
    - "アプリ"
    - "スマホ"
    - "副業"
    - "時短"
    - "自動化"
    - "初心者"
  exclude:                   # ★難しすぎ/副業に無関係（1つでも該当したら不採用）
    - "セキュリティ"
    - "サイバー"
    - "防御"
    - "脆弱性"
    - "攻撃"
    - "規制"
    - "訴訟"
    - "軍事"
    - "政府"
    - "決算"
    - "資金調達"
    - "買収"
    - "上場"
    - "株価"
    - "特許"
    - "半導体"
    - "GPU"
    - "データセンター"
    - "量子"
    - "研究"
    - "論文"
    - "エンタープライズ"
    - "企業向け"
    - "API仕様"

# --- 7. NGライン（ガードレール）------------------------------
ng:
  topics:
    - "政治・宗教・センシティブな時事"
    - "医療・投資などの断定的アドバイス"
  words:
    - "誰でも簡単に"
    - "完全放置で稼げる"
    - "絶対に稼げる／絶対に損しない"
    - "月100万確定"

# --- 8. 画像（Pexels厳選写真）設定 --------------------------
# 朝の枠(image: true)だけ、下の photos から1枚を日付で決定的にローテして添付します（src/pexels.mjs）。
#   - photos は人手で目視確認した「人物・他社ロゴなし」のクリーンな写真URLだけを入れる
#   - ライブ検索はブランド物・人物の混入が避けられないため使わない（photos があれば検索しない）
#   - photos を空にすると、フォールバックで queries のライブ検索に切り替わる（非推奨）
#   URLの足し方: pexels.com で写真を選び、ID を使って次の形にする
#     https://images.pexels.com/photos/<ID>/pexels-photo-<ID>.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080
image:
  pexels:
    photos:                        # 厳選ローテ（在宅ワーク感・清潔感・コーヒー中心）
      - "https://images.pexels.com/photos/27860686/pexels-photo-27860686.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
      - "https://images.pexels.com/photos/31711944/pexels-photo-31711944.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
      - "https://images.pexels.com/photos/26985929/pexels-photo-26985929.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
      - "https://images.pexels.com/photos/4913342/pexels-photo-4913342.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1080&h=1080"
    # queries はフォールバック用（photos が空のときだけ使用）
    queries:
      - "coffee"
      - "office"
# ============================================================
